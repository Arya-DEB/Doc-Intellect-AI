#yaml
services:
  backend:
    build:
      context: ./backend
    container_name: doc-intellect-api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: doc-intellect-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
