<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a6b"/>
      <stop offset="1" stop-color="#171735"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- brain, scaled up to fill the icon -->
  <g transform="translate(32 32) scale(1.15) translate(-32 -31)"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- two hemispheres -->
    <g fill="#8b5cf6" fill-opacity="0.45" stroke="#c4b5fd" stroke-width="3.5">
      <path d="M30 12C24 8 14 10 13 19C7 21 6 30 11 34C8 40 12 48 19 48C21 54 30 55 31 50Z"/>
      <path d="M34 12C40 8 50 10 51 19C57 21 58 30 53 34C56 40 52 48 45 48C43 54 34 55 33 50Z"/>
    </g>

    <!-- bold folds so it reads as a brain, not a blob -->
    <g fill="none" stroke="#ede9fe" stroke-width="3">
      <path d="M13 19C19 19 22 23 22 28"/>
      <path d="M11 34C17 33 21 36 21 41"/>
      <path d="M51 19C45 19 42 23 42 28"/>
      <path d="M53 34C47 33 43 36 43 41"/>
    </g>
  </g>
</svg>